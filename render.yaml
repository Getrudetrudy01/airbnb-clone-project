# Render Blueprint: one web service (Django API + React app) and a PostgreSQL database.
# Setup guide: docs/deploy-render.md
services:
  - type: web
    name: keyhouse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Free instances have no pre-deploy step: the start script migrates, creates the admin
    # from DJANGO_SUPERUSER_* if set, optionally seeds demo data, then starts Gunicorn.
    dockerCommand: sh scripts/start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: keyhouse-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2" # Fits the free instance's memory.
      - key: SEED_DEMO
        value: "False" # "True" loads the demo listings: for a demo site only.
      # Set these in the dashboard; they're secrets, so they never live in the repo.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: keyhouse-db
    plan: free
    databaseName: keyhouse
    user: keyhouse
