name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-latest

    # MySQL is the documented database; PostgreSQL is what Render provides. Test both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            database_url: mysql://root:root@127.0.0.1:3306/airbnb
          - database: postgres
            database_url: postgres://postgres:postgres@127.0.0.1:5432/airbnb

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: airbnb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airbnb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      DATABASE_URL: ${{ matrix.database_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest --cov=apps --cov=config --cov-report=term-missing

      - name: Check production settings
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-a-long-random-looking-string-that-is-not-used-anywhere-else-1234567890
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
