name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: airbnb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/airbnb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest --cov=apps --cov=config --cov-report=term-missing

      - name: Check production settings
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-a-long-random-looking-string-that-is-not-used-anywhere-else-1234567890
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING
